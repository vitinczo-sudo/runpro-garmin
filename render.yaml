services:
  - type: web
    name: runpro-garmin
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://runpro-garmin.onrender.com
      - key: FRONTEND_ORIGINS
        value: https://runpro-garmin.onrender.com
      - key: APP_BASE_URL
        value: https://runpro-garmin.onrender.com
      - key: APP_PUBLIC_URL
        value: https://runpro-garmin.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GARMIN_CLIENT_ID
        sync: false
      - key: GARMIN_CLIENT_SECRET
        sync: false
      - key: GARMIN_OAUTH_AUTHORIZE_URL
        sync: false
      - key: GARMIN_OAUTH_TOKEN_URL
        sync: false
      - key: GARMIN_OAUTH_SCOPE
        value: activity_export workout_import
      - key: GARMIN_ACTIVITY_PULL_URL
        sync: false
      - key: GARMIN_TRAINING_PUSH_URL
        sync: false
      - key: GARMIN_WEBHOOK_TOKEN
        sync: false
